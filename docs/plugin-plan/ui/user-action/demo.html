<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>用户消息操作栏 · 演示</title>
  <style>
    :root {
      color-scheme: dark;
      --gray-800: #212121;
      --ds-bg-primary: #181818;
      --ds-bg-under: #000;
      --ds-bg-composer: color-mix(in oklab, var(--gray-800) 96%, transparent);
      --ds-text-primary: #fff;
      --ds-text-secondary: color-mix(in oklab, #fff 70%, transparent);
      --ds-text-muted: color-mix(in oklab, #fff 52%, transparent);
      --ds-text-faint: color-mix(in oklab, #fff 38%, transparent);
      --ds-tile: color-mix(in oklab, #fff 3.5%, transparent);
      --ds-tile-deep: color-mix(in oklab, #fff 8%, transparent);
      --ds-bg-hover: color-mix(in oklab, #fff 6%, transparent);
      --ds-accent: #fff;
      --ds-purple: #c27aff;
      --ds-blue: #6cb2ff;
      --ds-error: #ff6764;
      --ds-warning: #ff8549;
      --ds-success: #40c977;
      --ds-shadow-composer: 0 3px 7.5px #0000000a, 0 0 20px #0000000d;
      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 12px;
      --radius-lg-plus: 16px;
      --radius-2xl: 22px;
      --ui: #c27aff;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      font-family: var(--font);
      background: var(--ds-bg-under);
      color: var(--ds-text-primary);
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; }

    .shell {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      background: var(--ds-bg-primary);
    }
    .topbar {
      padding: 14px 28px 12px;
      border-bottom: 1px solid color-mix(in oklab, #fff 6%, transparent);
    }
    .topbar h1 { margin: 0; font-size: 14px; font-weight: 560; }

    .thread { flex: 1; min-height: 0; overflow: auto; }
    .inner {
      width: min(760px, calc(100% - 48px));
      margin: 0 auto;
      padding: 28px 0 40px;
      display: flex;
      flex-direction: column;
    }

    .stage {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 26px 0 10px;
      color: var(--ds-text-faint);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
    }
    .stage::after { content: ""; flex: 1; height: 1px; background: color-mix(in oklab, #fff 6%, transparent); }
    .stage .no {
      display: inline-grid;
      place-items: center;
      min-width: 18px;
      height: 18px;
      border-radius: 99px;
      background: var(--ds-tile-deep);
      color: var(--ds-text-secondary);
      font-size: 10.5px;
    }
    .stage .hint {
      color: var(--ds-text-muted);
      letter-spacing: 0;
      font-family: var(--font);
      font-size: 11.5px;
    }

    .message-row.user {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      padding: 12px 0;
    }
    .message-col {
      display: flex;
      min-width: 0;
      width: min(max-content, 82%, 600px);
      max-width: min(82%, 600px);
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
    }
    .message-bubble {
      width: max-content;
      max-width: 100%;
      border-radius: var(--radius-lg-plus);
      border-bottom-right-radius: var(--radius-xs);
      background: color-mix(in oklab, #fff 8%, transparent);
      padding: 10px 15px;
      color: var(--ds-text-primary);
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }
    .message-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      min-height: 24px;
      justify-content: flex-end;
    }
    .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      min-height: 24px;
      padding: 3px 5px;
      border: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--ds-text-muted);
      cursor: default;
    }
    .copy-btn svg { display: block; }
    .copy-btn.label {
      gap: 4px;
      padding: 3px 8px;
      font-size: 11.5px;
      color: var(--ds-text-secondary);
    }
    .copy-btn.host-lock {
      color: var(--ds-text-muted);
      cursor: not-allowed;
    }
    .copy-btn.plugin {
      gap: 4px;
      padding: 3px 8px;
      font-size: 11.5px;
      color: var(--ui);
      background: color-mix(in oklab, var(--ui) 12%, transparent);
    }

    .slot-box {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      min-height: 26px;
      min-width: 36px;
      margin: 0 3px;
      padding: 2px 6px;
      border: 1px dashed color-mix(in oklab, var(--ui) 55%, transparent);
      border-radius: 10px;
    }
    .slot-box .slot-name {
      position: absolute;
      top: -9px;
      left: 8px;
      padding: 0 5px;
      background: var(--ds-bg-primary);
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.04em;
      color: #e4c8ff;
      white-space: nowrap;
    }
    .host-keys {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      margin: 0 4px;
    }
    .host-keys.locked {
      outline: 1px solid color-mix(in oklab, #fff 14%, transparent);
      outline-offset: 3px;
      border-radius: var(--radius-sm);
      opacity: 0.72;
    }

    .composer-dock {
      padding: 0 24px 16px;
      background: var(--ds-bg-primary);
    }
    .composer-shell {
      width: min(760px, 100%);
      margin: 0 auto;
      border-radius: var(--radius-2xl);
      background: var(--ds-bg-composer);
      box-shadow: var(--ds-shadow-composer);
      padding: 10px 12px 8px;
    }
    .composer-input {
      min-height: 40px;
      color: var(--ds-text-faint);
      font-size: 14px;
      padding: 4px 4px 10px;
    }
    .composer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ds-text-faint);
      font-size: 12px;
    }
    .send {
      width: 28px; height: 28px; border: 0; border-radius: 99px;
      background: var(--ds-accent); color: #181818;
      display: grid; place-items: center; cursor: default;
    }

    .plan-nav{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:10px 28px;background:#0c0c0c;border-bottom:1px solid color-mix(in oklab, #fff 8%, transparent);font-size:13px;flex:0 0 auto}
    .plan-nav a{color:var(--ds-text-muted);text-decoration:none;padding:3px 8px;border-radius:6px}
    .plan-nav a:hover{background:var(--ds-bg-hover);color:var(--ds-text-primary)}
    .plan-nav a[aria-current="page"]{background:var(--ds-tile-deep);color:var(--ds-text-primary);box-shadow:inset 0 0 0 1px color-mix(in oklab, #fff 14%, transparent)}
    .plan-nav .sep{color:var(--ds-text-faint);padding:0 2px}
    .plan-nav .spacer{flex:1}
    .plan-nav .here{color:var(--ds-text-primary);padding:3px 8px}
  </style>
</head>
