<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v2" />
    <title>Advisor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #181818;
        --fg: #ffffff;
        --muted: color-mix(in oklab, #ffffff 52%, transparent);
        --border: color-mix(in oklab, #ffffff 10%, transparent);
        --hover: color-mix(in oklab, #ffffff 6%, transparent);
        --accent: #ffffff;
        font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      :root[data-base="light"] {
        color-scheme: light;
        --bg: #fafafa;
        --fg: #1a1c1f;
        --muted: #5d5d5d;
        --border: color-mix(in oklab, #1a1c1f 10%, transparent);
        --hover: color-mix(in oklab, #1a1c1f 5%, transparent);
        --accent: #1a1c1f;
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      body { padding-top: var(--pi-plugin-titlebar-height, 0px); }
      .wrap { display: flex; flex-direction: column; height: 100%; padding: 12px; gap: 10px; }
      label { color: var(--muted); font-size: 11px; }
      input, select, button {
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 8px;
      }
      input { width: 100%; }
      .list {
        flex: 1;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .row {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        border-radius: 0;
        padding: 8px 10px;
        cursor: pointer;
      }
      .row:hover { background: var(--hover); }
      .row[aria-selected="true"] { background: var(--hover); }
      .row small { display: block; color: var(--muted); }
      .actions { display: flex; gap: 8px; }
      .actions button { flex: 1; cursor: pointer; }
      .primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
      .empty { padding: 16px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <label for="filter">Reviewer model</label>
      <input id="filter" type="search" placeholder="Filter by name or provider" />
      <div class="list" id="list" role="listbox"></div>
      <label for="effort">Effort</label>
      <select id="effort">
        <option value="off">off (no reasoning)</option>
        <option value="minimal">minimal</option>
        <option value="low">low</option>
        <option value="medium">medium</option>
        <option value="high" selected>high (recommended)</option>
        <option value="xhigh">xhigh</option>
        <option value="max">max</option>
      </select>
      <div class="actions">
        <button id="clear" type="button">No advisor</button>
        <button id="save" class="primary" type="button">Use selected</button>
      </div>
    </div>
    <script>
      const listEl = document.getElementById("list");
      const filterEl = document.getElementById("filter");
      const effortEl = document.getElementById("effort");
      const saveEl = document.getElementById("save");
      const clearEl = document.getElementById("clear");
      let models = [];
      let selected = "";

      function applyAppearance(appearance) {
        const base = appearance?.base === "light" || appearance?.base === "dark"
          ? appearance.base
          : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.base = base;
      }

      function render() {
        const query = filterEl.value.trim().toLowerCase();
        const shown = models.filter((model) => {
          if (!query) return true;
          return `${model.label} ${model.key}`.toLowerCase().includes(query);
        });
        listEl.innerHTML = "";
        if (!shown.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = models.length ? "No matches" : "No authenticated models. Sign in a provider first.";
          listEl.append(empty);
          return;
        }
        for (const model of shown) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "row";
          button.setAttribute("role", "option");
          button.setAttribute("aria-selected", String(model.key === selected));
          button.innerHTML = `${escapeHtml(model.label)}<small>${escapeHtml(model.key)}</small>`;
          button.addEventListener("click", () => {
            selected = model.key;
            render();
          });
          listEl.append(button);
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      async function load() {
        const state = await window.pluginBridge.invoke("advisor.get");
        models = Array.isArray(state?.models) ? state.models : [];
        selected = String(state?.modelKey ?? "");
        if (state?.effort) effortEl.value = state.effort;
        render();
      }

      filterEl.addEventListener("input", render);
      saveEl.addEventListener("click", async () => {
        if (!selected) return;
        await window.pluginBridge.invoke("advisor.set", {
          modelKey: selected,
          effort: effortEl.value,
        });
      });
      clearEl.addEventListener("click", async () => {
        selected = "";
        await window.pluginBridge.invoke("advisor.clear");
        render();
      });

      window.pluginBridge.on("appearance:changed", applyAppearance);
      window.pluginBridge.invoke("app.getAppearance").then(applyAppearance).catch(() => {});
      load().catch((error) => {
        listEl.innerHTML = `<div class="empty">${escapeHtml(error?.message || error)}</div>`;
      });
    </script>
  </body>
</html>
