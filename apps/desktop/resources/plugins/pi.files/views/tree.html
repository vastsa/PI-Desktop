<!doctype html>
<html lang="en">
  <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="pi-plugin-chrome" content="v2" />
      <title>Files</title>
    <style>
      :root {
        color-scheme: dark;
        /* Mirror the host's neutral Codex ramp; plugin pages cannot inherit
           renderer CSS, so these values intentionally track tokens.css. */
        --bg: #181818;
        --surface: #181818;
        --surface-hover: color-mix(in oklab, #ffffff 6%, transparent);
        --surface-active: color-mix(in oklab, #ffffff 10%, transparent);
        --fg: #ffffff;
        --secondary: color-mix(in oklab, #ffffff 70%, transparent);
        --muted: color-mix(in oklab, #ffffff 52%, transparent);
        --faint: color-mix(in oklab, #ffffff 38%, transparent);
        --border: color-mix(in oklab, #ffffff 5%, transparent);
        --border-strong: color-mix(in oklab, #ffffff 14%, transparent);
        --accent: #ffffff;
        --danger: #ff6764;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      :root[data-base="light"] {
        color-scheme: light;
        --bg: #fafafa;
        --surface: #ffffff;
        --surface-hover: color-mix(in oklab, #1a1c1f 5%, transparent);
        --surface-active: color-mix(in oklab, #1a1c1f 8%, transparent);
        --fg: #1a1c1f;
        --secondary: color-mix(in oklab, #1a1c1f 74%, transparent);
        --muted: #5d5d5d;
        --faint: #afafaf;
        --border: color-mix(in oklab, #1a1c1f 5%, transparent);
        --border-strong: color-mix(in oklab, #1a1c1f 12%, transparent);
        --accent: #1a1c1f;
        --danger: #e02e2a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        margin: 0;
        padding-top: var(--pi-plugin-titlebar-height, 0px);
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
      }
      button {
        font: inherit;
      }
      button:focus-visible {
        outline: 2px solid color-mix(in oklab, var(--accent) 58%, transparent);
        outline-offset: -2px;
      }
      .app {
        display: flex;
        height: 100%;
        min-height: 0;
        flex-direction: column;
      }
      .toolbar {
        display: flex;
        min-height: 36px;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 4px 8px 4px 10px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .toolbar-title {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 7px;
      }
      .toolbar-icon {
        display: inline-flex;
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 0;
        color: var(--secondary);
      }
      .toolbar-copy {
        display: flex;
        min-width: 0;
        align-items: baseline;
        gap: 6px;
      }
      .toolbar-name,
      .toolbar-subtitle {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .toolbar-name {
        font-size: 12.5px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .toolbar-subtitle {
        min-width: 0;
        color: var(--muted);
        font-size: 11px;
      }
      .icon-button {
        display: inline-flex;
        width: 28px;
        height: 28px;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--secondary);
        cursor: pointer;
        transition:
          background 150ms cubic-bezier(0.22, 1, 0.36, 1),
          color 150ms cubic-bezier(0.22, 1, 0.36, 1),
          opacity 150ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .icon-button:hover {
        background: var(--surface-hover);
        color: var(--fg);
      }
      .icon-button:disabled {
        cursor: default;
        opacity: 0.4;
      }
      .icon-button[data-loading="true"] svg {
        animation: spin 800ms linear infinite;
      }
      .content {
        min-height: 0;
        flex: 1;
        overflow: hidden;
      }
      .view {
        height: 100%;
        min-height: 0;
      }
      /* The view sections set their own display (flex) for layout, which would
         otherwise override the UA `[hidden] { display: none }` rule and leave
         the tree and the viewer visible at the same time when switching.
         Re-assert the hidden contract so toggling works. */
      .view[hidden] {
        display: none !important;
      }
      .tree-view {
        display: flex;
        flex-direction: column;
      }
      .section-bar {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 12px 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .count {
        color: var(--faint);
        font-variant-numeric: tabular-nums;
        letter-spacing: normal;
      }
      #tree {
        min-height: 0;
        flex: 1;
        overflow: auto;
        padding: 0 6px 16px;
        scrollbar-gutter: stable;
      }
      .tree-row {
        display: flex;
        width: 100%;
        min-height: 24px;
        align-items: center;
        gap: 6px;
        border: 0;
        border-radius: 6px;
        padding: 3px 8px 3px 6px;
        background: transparent;
        color: var(--secondary);
        cursor: pointer;
        font-size: 12px;
        line-height: 1.45;
        text-align: left;
        transition:
          background 150ms cubic-bezier(0.22, 1, 0.36, 1),
          color 150ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .tree-row:hover {
        background: var(--surface-hover);
        color: var(--fg);
      }
      .tree-row[aria-current="true"] {
        background: var(--surface-active);
        color: var(--fg);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .tree-row[aria-expanded="true"] {
        color: var(--fg);
      }
      .tree-caret {
        display: inline-flex;
        width: 12px;
        height: 14px;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        color: var(--faint);
        transition: transform 150ms ease-out;
      }
      .tree-row[aria-expanded="true"] .tree-caret {
        transform: rotate(90deg);
      }
      .tree-icon {
        display: inline-flex;
        width: 15px;
        height: 15px;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        color: var(--muted);
      }
      .tree-row[aria-expanded="true"] .tree-icon {
        color: var(--secondary);
      }
      .tree-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tree-size {
        margin-left: auto;
        flex: 0 0 auto;
        color: var(--faint);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
      }
      .tree-note,
      .empty {
        color: var(--muted);
        text-align: center;
      }
      .tree-note {
        display: flex;
        min-height: 24px;
        align-items: center;
        gap: 4px;
        padding: 3px 12px;
        text-align: left;
      }
      .tree-note.error {
        color: var(--danger);
      }
      .tree-retry {
        margin-left: auto;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .mini-spinner {
        display: inline-block;
        width: 11px;
        height: 11px;
        flex: 0 0 auto;
        border: 1.5px solid var(--border-strong);
        border-top-color: var(--secondary);
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }
      .empty {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        padding: 28px 24px;
      }
      .empty-inner {
        display: flex;
        max-width: 30ch;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .empty-icon {
        display: inline-flex;
        width: 38px;
        height: 38px;
        align-items: center;
        justify-content: center;
        margin-bottom: 4px;
        border-radius: 50%;
        background: color-mix(in oklab, var(--fg) 7%, transparent);
        color: var(--secondary);
      }
      .empty-title {
        color: var(--fg);
        font-size: 15px;
        font-weight: 520;
      }
      .empty-copy {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }
      .viewer-view {
        display: flex;
        flex-direction: column;
      }
      .viewer-header {
        display: flex;
        min-height: 42px;
        flex: 0 0 auto;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      .viewer-path {
        min-width: 0;
        flex: 1;
        overflow: hidden;
        color: var(--fg);
        font-family: var(--mono);
        font-size: 11px;
        direction: rtl;
        text-overflow: ellipsis;
        text-align: left;
        white-space: nowrap;
      }
      .viewer-meta {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
      }
      .viewer-body {
        min-height: 0;
        flex: 1;
        overflow: auto;
      }
      .viewer-image {
        display: flex;
        min-height: 0;
        height: 100%;
        align-items: center;
        justify-content: center;
        padding: 16px;
        overflow: auto;
        background:
          repeating-conic-gradient(var(--border) 0% 25%, transparent 0% 50%) 0 0 / 16px 16px;
      }
      .viewer-image img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 4px;
      }
      .viewer-loading,
      .viewer-message {
        display: flex;
        min-height: 112px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 24px 16px;
        color: var(--muted);
        text-align: center;
      }
      .code {
        min-width: max-content;
        margin: 0;
        padding: 10px 0 20px;
        color: var(--fg);
        font: 11.5px/1.5 var(--mono);
        tab-size: 2;
        white-space: pre;
      }
      .code-line {
        display: flex;
        min-height: 1.55em;
      }
      .line-number {
        width: 42px;
        flex: 0 0 auto;
        padding-right: 10px;
        color: var(--faint);
        text-align: right;
        user-select: none;
      }
      .line-content {
        padding-right: 16px;
      }
      .truncated {
        padding: 10px 16px 0 58px;
        color: var(--muted);
        font: 10px/1.5 var(--mono);
      }
      .markdown-body {
        max-width: 760px;
        padding: 16px 20px 28px;
        color: var(--fg);
        font-size: 13px;
        line-height: 1.65;
        overflow-wrap: break-word;
      }
      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4 {
        margin: 1.2em 0 0.5em;
        font-weight: 600;
        line-height: 1.3;
      }
      .markdown-body h1 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
      .markdown-body h2 { font-size: 1.25em; }
      .markdown-body h3 { font-size: 1.1em; }
      .markdown-body p { margin: 0.6em 0; }
      .markdown-body ul,
      .markdown-body ol { margin: 0.6em 0; padding-left: 1.6em; }
      .markdown-body li { margin: 0.2em 0; }
      .markdown-body a { color: var(--accent); text-decoration: none; }
      .markdown-body a:hover { text-decoration: underline; }
      .markdown-body code {
        padding: 0.15em 0.4em;
        border-radius: 4px;
        background: var(--surface-hover);
        font: 11.5px/1.4 var(--mono);
      }
      .markdown-body pre {
        margin: 0.8em 0;
        padding: 12px 14px;
        border-radius: 6px;
        background: var(--surface-hover);
        overflow: auto;
      }
      .markdown-body pre code { padding: 0; background: none; }
      .markdown-body blockquote {
        margin: 0.8em 0;
        padding: 2px 14px;
        border-left: 3px solid var(--border);
        color: var(--muted);
      }
      .markdown-body hr { border: 0; border-top: 1px solid var(--border); margin: 1.2em 0; }
      .markdown-body table { border-collapse: collapse; margin: 0.8em 0; }
      .markdown-body th,
      .markdown-body td { border: 1px solid var(--border); padding: 4px 10px; }
      .markdown-body th { background: var(--surface-hover); }
      .markdown-body img { max-width: 100%; border-radius: 4px; }
      @media (prefers-reduced-motion: reduce) {
        .tree-caret,
        .icon-button,
        .tree-row {
          transition: none;
        }
        .icon-button[data-loading="true"] svg,
        .mini-spinner {
          animation: none;
        }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <div class="toolbar-title">
          <span class="toolbar-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5h6l2 2h9v9.5a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3.5 18z"/><path d="M3.5 6.5V5A1.5 1.5 0 0 1 5 3.5h4l2 2h6"/></svg>
          </span>
          <span class="toolbar-copy">
            <span class="toolbar-name" id="toolbar-name">Files</span>
            <span class="toolbar-subtitle" id="toolbar-subtitle">Project files</span>
          </span>
        </div>
        <button class="icon-button" id="refresh" type="button" title="Refresh" aria-label="Refresh" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3.9L3 9"/><path d="M3 4v5h5"/><path d="M4 13a8 8 0 0 0 14.9 3.9L21 15"/><path d="M21 20v-5h-5"/></svg>
        </button>
      </header>
      <main class="content">
        <section class="view tree-view" id="tree-view" aria-labelledby="tree-label">
          <div class="section-bar">
            <span id="tree-label">Project files</span>
            <span class="count" id="tree-count"></span>
          </div>
          <div id="tree" role="tree" aria-busy="true"></div>
        </section>
        <section class="view viewer-view" id="viewer-view" aria-labelledby="viewer-path" hidden>
          <header class="viewer-header">
            <button class="icon-button" id="back" type="button" title="Back to files" aria-label="Back to files">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span class="viewer-path" id="viewer-path" title=""></span>
            <span class="viewer-meta" id="viewer-meta"></span>
            <button class="icon-button" id="reveal" type="button" title="Show in folder" aria-label="Show in folder" disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5h6l2 2h9l-2 9a1.5 1.5 0 0 1-1.5 1.2h-14a1.5 1.5 0 0 1-1.5-1.8z"/><path d="M3.5 7.5V5A1.5 1.5 0 0 1 5 3.5h4l2 2h6"/></svg>
            </button>
          </header>
          <div class="viewer-body" id="viewer-body"></div>
        </section>
      </main>
    </div>

    <script>
      const bridge = window.pluginBridge;
      const treeView = document.getElementById("tree-view");
      const tree = document.getElementById("tree");
      const treeCount = document.getElementById("tree-count");
      const viewerView = document.getElementById("viewer-view");
      const viewerPath = document.getElementById("viewer-path");
      const viewerMeta = document.getElementById("viewer-meta");
      const viewerBody = document.getElementById("viewer-body");
      const refreshButton = document.getElementById("refresh");
      const revealButton = document.getElementById("reveal");
      const toolbarName = document.getElementById("toolbar-name");
      const toolbarSubtitle = document.getElementById("toolbar-subtitle");

      const MAX_LINES = 5000;
      const MAX_TEXT_BYTES = 512 * 1024;
      const expanded = new Set();
      const directories = new Map();
      const fileSizes = new Map();
      let selected = null;
      let workspace = null;
      let workspaceLoaded = false;
      let workspaceRevision = 0;
      let locale = "en";
      let isRefreshing = false;
      let isRevealing = false;
      let viewerState = null;

      const copy = {
        en: {
          files: "Files",
          projectFiles: "Project files",
          noWorkspace: "Open a project to browse its files.",
          noWorkspaceTitle: "No project open",
          noWorkspaceCopy: "Choose a project from the sidebar, then come back here to inspect its files.",
          empty: "This project has no readable files.",
          loading: "Loading…",
          refreshing: "Refreshing…",
          error: "Could not load this folder.",
          retry: "Retry",
          refresh: "Refresh",
          back: "Back to files",
          binary: "This file cannot be previewed as text.",
          image: "Image preview is not available in the plugin view.",
          tooLarge: "This file is too large to preview.",
          readError: "Could not read this file.",
          reveal: "Show in folder",
          revealing: "Showing…",
          revealError: "Could not show this file in its folder.",
          truncated: "Preview truncated after {count} lines.",
          folder: "folder",
          file: "file",
        },
        zh: {
          files: "文件",
          projectFiles: "项目文件",
          noWorkspace: "打开项目后即可浏览文件。",
          noWorkspaceTitle: "尚未打开项目",
          noWorkspaceCopy: "请先从侧边栏选择项目，再回到这里查看文件。",
          empty: "此项目没有可读取的文件。",
          loading: "加载中…",
          refreshing: "刷新中…",
          error: "无法加载此文件夹。",
          retry: "重试",
          refresh: "刷新",
          back: "返回文件列表",
          binary: "此文件无法以文本方式预览。",
          image: "插件视图暂不支持图片预览。",
          tooLarge: "此文件过大，无法预览。",
          readError: "无法读取此文件。",
          reveal: "在文件夹中显示",
          revealing: "显示中…",
          revealError: "无法在文件夹中显示此文件。",
          truncated: "预览已截断，仅显示前 {count} 行。",
          folder: "文件夹",
          file: "文件",
        },
      };

      const t = (key, values = {}) => {
        const text = copy[locale]?.[key] ?? copy.en[key] ?? key;
        return text.replace(/\{(\w+)\}/g, (_, name) => String(values[name] ?? ""));
      };

      const svg = {
        folder: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6.5h6l2 2h9v9.5a1.5 1.5 0 0 1-1.5 1.5h-14A1.5 1.5 0 0 1 3.5 18z"/><path d="M3.5 6.5V5A1.5 1.5 0 0 1 5 3.5h4l2 2h6"/></svg>',
        file: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h8l4 4V20a.5.5 0 0 1-.5.5h-11A.5.5 0 0 1 6 20z"/><path d="M14 3.5V8h4"/><path d="M9 12h6M9 15.5h6"/></svg>',
        caret: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
      };

      const isImagePath = (path) => /\.(?:png|jpe?g|gif|webp|svg|ico|bmp|avif)$/i.test(path);
      const isMarkdownPath = (path) => /\.(?:md|mdx|markdown)$/i.test(path);
      const isHtmlPath = (path) => /\.(?:html?|htm)$/i.test(path);
      const formatSize = (bytes) => {
        if (typeof bytes !== "number") return "";
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      };
      const childPath = (parent, name) => parent ? `${parent}/${name}` : name;
      const sortedEntries = (entries) => [
        ...entries.filter((entry) => entry.isDirectory),
        ...entries.filter((entry) => !entry.isDirectory),
      ];

      const setBaseTheme = (appearance) => {
        const base = appearance?.base;
        document.documentElement.dataset.base =
          base === "light" || base === "dark"
            ? base
            : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        const nextLocale = String(appearance?.locale ?? navigator.language).toLowerCase();
        locale = nextLocale.startsWith("zh") ? "zh" : "en";
        document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
        toolbarName.textContent = t("files");
        toolbarSubtitle.textContent = workspace?.name || t("projectFiles");
        document.getElementById("tree-label").textContent = t("projectFiles");
        refreshButton.title = t("refresh");
        refreshButton.setAttribute("aria-label", t("refresh"));
        document.getElementById("back").title = t("back");
        document.getElementById("back").setAttribute("aria-label", t("back"));
        revealButton.title = t("reveal");
        revealButton.setAttribute("aria-label", t("reveal"));
        if (!viewerView.hidden && selected) viewerPath.title = selected;
        renderTree();
        if (!viewerView.hidden && viewerState) {
          if (viewerState.type === "text") renderText(viewerState.text);
          else if (viewerState.type === "markdown" && typeof viewerState.text === "string")
            renderMarkdown(viewerState.text);
          else if (viewerState.type === "image" && typeof viewerState.dataUrl === "string")
            renderImage(viewerState.dataUrl);
          else if (viewerState.type !== "loading") showViewerMessage(viewerState.type);
        }
      };

      const directoryState = (path) => directories.get(path);

      const updateRefreshButton = () => {
        const rootLoading = !directoryState("") || directoryState("")?.loading === true;
        const loading = isRefreshing || rootLoading;
        refreshButton.disabled = !workspace || loading;
        refreshButton.dataset.loading = String(loading);
        const label = loading ? t("refreshing") : t("refresh");
        refreshButton.title = label;
        refreshButton.setAttribute("aria-label", label);
        refreshButton.setAttribute("aria-busy", String(loading));
      };

      const updateRevealButton = () => {
        const active = !viewerView.hidden && Boolean(selected);
        revealButton.disabled = !active || isRevealing;
        revealButton.dataset.loading = String(isRevealing);
        const label = isRevealing ? t("revealing") : t("reveal");
        revealButton.title = label;
        revealButton.setAttribute("aria-label", label);
        revealButton.setAttribute("aria-busy", String(isRevealing));
      };

      async function loadDirectory(path, force = false) {
        const revision = workspaceRevision;
        const existing = directoryState(path);
        if (existing?.loading && !force) return existing.promise;
        if (existing?.entries && !force) return existing.entries;
        const promise = bridge.invoke("fs.list", { path })
          .then((entries) => {
            if (revision !== workspaceRevision) return [];
            directories.set(path, { entries: Array.isArray(entries) ? entries : [] });
            renderTree();
            return entries;
          })
          .catch((error) => {
            if (revision !== workspaceRevision) return [];
            directories.set(path, { error });
            renderTree();
            return [];
          });
        directories.set(path, { loading: true, promise });
        renderTree();
        return promise;
      }

      const makeTreeNote = (message, path, retry = false) => {
        const note = document.createElement("div");
        note.className = `tree-note${retry ? " error" : ""}`;
        if (!retry && message === t("loading")) {
          const spinner = document.createElement("span");
          spinner.className = "mini-spinner";
          spinner.setAttribute("aria-hidden", "true");
          note.append(spinner);
        }
        const copy = document.createElement("span");
        copy.textContent = message;
        note.append(copy);
        if (retry) {
          const button = document.createElement("button");
          button.className = "tree-retry";
          button.type = "button";
          button.textContent = t("retry");
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            void loadDirectory(path, true);
          });
          note.append(button);
        }
        return note;
      };

      const makeRow = (entry, depth) => {
        const row = document.createElement("button");
        const path = entry.path || childPath("", entry.name);
        row.type = "button";
        row.className = "tree-row";
        row.dataset.path = path;
        row.dataset.directory = entry.isDirectory ? "true" : "false";
        if (!entry.isDirectory && typeof entry.size === "number") fileSizes.set(path, entry.size);
        row.style.paddingLeft = `${6 + depth * 14}px`;
        row.setAttribute("role", "treeitem");
        row.setAttribute("aria-label", entry.isDirectory ? `${entry.name}, ${t("folder")}` : entry.name);
        row.title = path;
        if (entry.isDirectory) {
          const open = expanded.has(path);
          row.setAttribute("aria-expanded", String(open));
          row.innerHTML = `<span class="tree-caret">${svg.caret}</span><span class="tree-icon">${svg.folder}</span><span class="tree-name"></span>`;
          row.querySelector(".tree-name").textContent = entry.name;
        } else {
          row.setAttribute("aria-current", String(selected === path));
          row.innerHTML = `<span class="tree-caret"></span><span class="tree-icon">${svg.file}</span><span class="tree-name"></span><span class="tree-size"></span>`;
          row.querySelector(".tree-name").textContent = entry.name;
          row.querySelector(".tree-size").textContent = formatSize(entry.size);
        }
        return row;
      };

      const renderDirectory = (path, depth, into) => {
        const state = directoryState(path);
        if (!state) {
          into.append(makeTreeNote(t("loading"), path));
          return;
        }
        if (state.loading) {
          into.append(makeTreeNote(t("loading"), path));
          return;
        }
        if (state.error) {
          into.append(makeTreeNote(t("error"), path, true));
          return;
        }
        if (!state.entries.length) {
          into.append(makeTreeNote(t("empty"), path));
          return;
        }
        for (const entry of sortedEntries(state.entries)) {
          const row = makeRow(entry, depth);
          into.append(row);
          if (entry.isDirectory && expanded.has(entry.path || childPath(path, entry.name))) {
            renderDirectory(entry.path || childPath(path, entry.name), depth + 1, into);
          }
        }
      };

      function renderTree() {
        tree.replaceChildren();
        tree.setAttribute("aria-busy", String(!directoryState("")));
        if (!workspace) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.innerHTML = `<div class="empty-inner"><span class="empty-icon">${svg.folder}</span><span class="empty-title"></span><span class="empty-copy"></span></div>`;
          empty.querySelector(".empty-title").textContent = t("noWorkspaceTitle");
          empty.querySelector(".empty-copy").textContent = t("noWorkspaceCopy");
          empty.querySelector(".empty-icon").setAttribute("aria-hidden", "true");
          tree.append(empty);
          treeCount.textContent = "";
          updateRefreshButton();
          return;
        }
        tree.setAttribute("aria-busy", String(!directoryState("")));
        const fragment = document.createDocumentFragment();
        renderDirectory("", 0, fragment);
        tree.replaceChildren(fragment);
        const root = directoryState("");
        const count = root?.entries?.length;
        treeCount.textContent = typeof count === "number" ? String(count) : "";
        toolbarSubtitle.textContent = workspace.name || t("projectFiles");
        updateRefreshButton();
      }

      const showTree = () => {
        viewerView.hidden = true;
        treeView.hidden = false;
        updateRevealButton();
        const row = selected && document.querySelector(`.tree-row[data-path="${CSS.escape(selected)}"]`);
        row?.focus();
      };

      const showViewer = (path) => {
        treeView.hidden = true;
        viewerView.hidden = false;
        viewerState = { type: "loading" };
        viewerPath.textContent = path;
        viewerPath.title = path;
        viewerMeta.textContent = "";
        viewerBody.replaceChildren();
        const loading = document.createElement("div");
        loading.className = "viewer-loading";
        const spinner = document.createElement("span");
        spinner.className = "mini-spinner";
        spinner.setAttribute("aria-hidden", "true");
        loading.append(spinner, document.createTextNode(t("loading")));
        loading.setAttribute("role", "status");
        viewerBody.append(loading);
        updateRevealButton();
      };

      const showViewerMessage = (messageKey) => {
        viewerState = { type: messageKey };
        const message = document.createElement("div");
        message.className = "viewer-message";
        message.setAttribute("role", "status");
        message.textContent = t(messageKey);
        viewerBody.replaceChildren(message);
      };

      const escapeHtml = (value) =>
        String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");

      const inlineMarkdown = (text) =>
        escapeHtml(text)
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/__([^_]+)__/g, "<strong>$1</strong>")
          .replace(/\*([^*]+)\*/g, "<em>$1</em>")
          .replace(/_([^_]+)_/g, "<em>$1</em>")
          .replace(
            /\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g,
            (_, label, href) => {
              if (/^(https?:|mailto:)/i.test(href)) {
                return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
              }
              return `<a href="${escapeHtml(href)}">${label}</a>`;
            },
          )
          .replace(
            /!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g,
            (_, alt, srcUrl) => `<img src="${escapeHtml(srcUrl)}" alt="${escapeHtml(alt || "")}" />`,
          );

      const renderMarkdown = (text) => {
        viewerState = { type: "markdown", text };
        const wrap = document.createElement("div");
        wrap.className = "markdown-body";
        const source = String(text || "").replace(/\r\n?/g, "\n");
        const lines = source.split("\n");
        const html = [];
        let inCode = false;
        let codeLang = "";
        let codeBuf = [];
        let inList = null;
        let inTable = false;
        let tableRows = [];
        const flushList = () => {
          if (inList === "ul") html.push("</ul>");
          else if (inList === "ol") html.push("</ol>");
          inList = null;
        };
        const flushTable = () => {
          if (!inTable) return;
          html.push("<table><thead><tr>" + tableRows[0].map((c) => `<th>${c}</th>`).join("") + "</tr></thead><tbody>");
          for (const row of tableRows.slice(1)) html.push("<tr>" + row.map((c) => `<td>${c}</td>`).join("") + "</tr>");
          html.push("</tbody></table>");
          inTable = false;
          tableRows = [];
        };
        for (const raw of lines) {
          const line = raw.trimEnd();
          if (line.trim().startsWith("```")) {
            if (!inCode) {
              flushList();
              flushTable();
              inCode = true;
              codeLang = line.trim().slice(3).trim();
              codeBuf = [];
            } else {
              html.push(`<pre><code>${codeBuf.join("\n")}</code></pre>`);
              inCode = false;
            }
            continue;
          }
          if (inCode) { codeBuf.push(escapeHtml(line)); continue; }
          if (!line.trim()) {
            flushList();
            flushTable();
            html.push("");
            continue;
          }
          if (/^\s*(?:#{1,6})\s+/.test(line)) {
            flushList(); flushTable();
            const level = line.match(/^(#{1,6})/)[1].length;
            html.push(`<h${level}>${inlineMarkdown(line.replace(/^\s*#{1,6}\s*/, ""))}</h${level}>`);
            continue;
          }
          if (/^\s*([-*+])\s+/.test(line)) {
            if (inList !== "ul") { flushList(); flushTable(); html.push("<ul>"); inList = "ul"; }
            html.push(`<li>${inlineMarkdown(line.replace(/^\s*[-*+]\s+/, ""))}</li>`);
            continue;
          }
          if (/^\s*\d+[.)]\s+/.test(line)) {
            if (inList !== "ol") { flushList(); flushTable(); html.push("<ol>"); inList = "ol"; }
            html.push(`<li>${inlineMarkdown(line.replace(/^\s*\d+[.)]\s+/, ""))}</li>`);
            continue;
          }
          if (/^\s*([-*_])\s*\1\s*\1(?:\s*\1)*\s*$/.test(line)) {
            flushList(); flushTable();
            html.push("<hr>");
            continue;
          }
          if (/^\s*&gt;\s*/.test(line)) {
            flushList();
            html.push(`<blockquote>${inlineMarkdown(line.replace(/^\s*&gt;\s*/, ""))}</blockquote>`);
            continue;
          }
          if (line.includes("|") && /^\s*\|?\s*:?-{2,}:?\s*(?:\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line) && !inTable) {
            // separator row for the table above
            continue;
          }
          if (line.includes("|")) {
            if (inTable) {
              tableRows.push(line.replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => inlineMarkdown(c.trim())));
            } else {
              flushList();
              inTable = true;
              tableRows = [line.replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => inlineMarkdown(c.trim()))];
            }
            continue;
          }
          if (inTable) { flushTable(); }
          flushList();
          html.push(`<p>${inlineMarkdown(line)}</p>`);
        }
        flushList();
        flushTable();
        if (inCode) html.push(`<pre><code>${codeBuf.join("\n")}</code></pre>`);
        wrap.innerHTML = html.join("\n");
        viewerBody.replaceChildren(wrap);
        viewerMeta.textContent = formatSize(fileSizes.get(selected));
      };

      const renderImage = (dataUrl) => {
        viewerState = { type: "image", dataUrl };
        const wrap = document.createElement("div");
        wrap.className = "viewer-image";
        const img = document.createElement("img");
        img.src = dataUrl;
        img.alt = selected || "";
        wrap.append(img);
        viewerBody.replaceChildren(wrap);
        viewerMeta.textContent = formatSize(fileSizes.get(selected));
      };

      const renderText = (text) => {
        viewerState = { type: "text", text };
        const lines = text.split("\n");
        const truncated = lines.length > MAX_LINES || text.length > MAX_TEXT_BYTES;
        const visible = lines.slice(0, MAX_LINES);
        const pre = document.createElement("pre");
        pre.className = "code";
        visible.forEach((line, index) => {
          const row = document.createElement("span");
          row.className = "code-line";
          const number = document.createElement("span");
          number.className = "line-number";
          number.textContent = String(index + 1);
          const content = document.createElement("span");
          content.className = "line-content";
          content.textContent = line || " ";
          row.append(number, content);
          pre.append(row);
        });
        viewerBody.replaceChildren(pre);
        if (truncated) {
          const note = document.createElement("div");
          note.className = "truncated";
          note.textContent = t("truncated", { count: MAX_LINES });
          viewerBody.append(note);
        }
        const size = formatSize(fileSizes.get(selected));
        const lineCount = `${lines.length} ${locale === "zh" ? "行" : "lines"}`;
        viewerMeta.textContent = size ? `${size} · ${lineCount}` : lineCount;
      };

      async function openFile(path) {
        selected = path;
        showViewer(path);
        viewerMeta.textContent = formatSize(fileSizes.get(path));
        if (isHtmlPath(path)) {
          try {
            await bridge.invoke("fs.previewInBrowser", { path });
          } catch {
            showViewerMessage("readError");
          }
          return;
        }
        if (isImagePath(path)) {
          try {
            const dataUrl = await bridge.invoke("fs.readImageDataUrl", { path });
            if (selected !== path) return;
            renderImage(dataUrl);
          } catch {
            showViewerMessage("readError");
          }
          return;
        }
        try {
          const text = await bridge.invoke("fs.readText", { path });
          if (selected !== path) return;
          if (typeof text !== "string" || text.includes("\0")) {
            showViewerMessage("binary");
            return;
          }
          if (isMarkdownPath(path)) {
            renderMarkdown(text);
          } else {
            renderText(text);
          }
        } catch {
          showViewerMessage("readError");
        }
      }

      revealButton.addEventListener("click", async () => {
        if (!selected || isRevealing) return;
        isRevealing = true;
        updateRevealButton();
        try {
          await bridge.invoke("fs.reveal", { path: selected });
        } catch {
          await bridge.invoke("ui.showToast", {
            message: t("revealError"),
            level: "error",
          }).catch(() => {});
        } finally {
          isRevealing = false;
          updateRevealButton();
        }
      });

      tree.addEventListener("click", (event) => {
        const row = event.target.closest(".tree-row");
        if (!row) return;
        const path = row.dataset.path;
        if (!path) return;
        if (row.dataset.directory === "true") {
          if (expanded.has(path)) expanded.delete(path);
          else expanded.add(path);
          if (expanded.has(path)) void loadDirectory(path);
          renderTree();
        } else {
          void openFile(path);
        }
      });

      tree.addEventListener("keydown", (event) => {
        const row = event.target.closest(".tree-row");
        if (!row) return;
        const rows = [...tree.querySelectorAll(".tree-row")];
        const index = rows.indexOf(row);
        if (event.key === "ArrowDown" || event.key === "ArrowUp") {
          event.preventDefault();
          rows[Math.max(0, Math.min(rows.length - 1, index + (event.key === "ArrowDown" ? 1 : -1)))]?.focus();
        } else if (event.key === "Home" || event.key === "End") {
          event.preventDefault();
          rows[event.key === "Home" ? 0 : rows.length - 1]?.focus();
        } else if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          row.click();
        } else if (event.key === "ArrowRight" && row.dataset.directory === "true") {
          event.preventDefault();
          const path = row.dataset.path;
          expanded.add(path);
          void loadDirectory(path);
          renderTree();
        } else if (event.key === "ArrowLeft" && row.dataset.directory === "true" && expanded.has(row.dataset.path)) {
          event.preventDefault();
          expanded.delete(row.dataset.path);
          renderTree();
        }
      });

      document.getElementById("back").addEventListener("click", showTree);
      refreshButton.addEventListener("click", async () => {
        if (!workspace || isRefreshing) return;
        isRefreshing = true;
        updateRefreshButton();
        directories.clear();
        fileSizes.clear();
        renderTree();
        try {
          await loadDirectory("");
          await Promise.all([...expanded].map((path) => loadDirectory(path)));
        } finally {
          isRefreshing = false;
          renderTree();
        }
      });

      async function syncWorkspace() {
        const nextWorkspace = await bridge.invoke("workspace.get").catch(() => null);
        const changed = !workspaceLoaded || nextWorkspace?.path !== workspace?.path;
        workspace = nextWorkspace;
        workspaceLoaded = true;
        toolbarSubtitle.textContent = workspace?.name || t("projectFiles");
        if (!changed) return;
        workspaceRevision += 1;
        directories.clear();
        fileSizes.clear();
        expanded.clear();
        selected = null;
        viewerState = null;
        viewerView.hidden = true;
        treeView.hidden = false;
        updateRevealButton();
        renderTree();
        if (workspace) await loadDirectory("");
      }

      bridge.on("appearance:changed", setBaseTheme);
      bridge.invoke("app.getAppearance").then(setBaseTheme).catch(() => setBaseTheme(null));
      void syncWorkspace();
      // The public panel bridge currently pushes appearance changes but not a
      // workspace event. A low-frequency check keeps a long-lived view from
      // showing the previous project's tree after a sidebar project switch.
      window.setInterval(() => void syncWorkspace(), 2000);
    </script>
  </body>
</html>
