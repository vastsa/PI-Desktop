name: Bug report / Bug 反馈
description: Report something that is not working. 报告产品异常。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Fill every required field so we can reproduce the issue.
        请填写所有必填项，便于复现与排查。

        Settings → Info shows the app version and can open this form with it filled in.
        「设置 → 信息」可查看版本，并从应用内打开本表单。
  - type: textarea
    id: description
    attributes:
      label: What happened? / 问题描述
      description: What broke, and what is the impact?
      placeholder: Opening Settings → Models crashes before the provider list appears.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Numbered steps from a cold start when possible.
      placeholder: |
        1. Open the app
        2. Open Settings → Models
        3. Click Add provider
        4. The window closes
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
      placeholder: The add-provider dialog opens.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      placeholder: The app window disappears with no error dialog.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version / 应用版本
      description: Copy from Settings → Info. Example 0.13.3
      placeholder: "0.13.3"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system / 操作系统
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Extra environment / 其他环境信息
      description: Architecture, protocol/host versions, and install type (DMG, NSIS, AppImage, deb, development). Settings → Info fills this when opened from the app.
      placeholder: darwin arm64 · protocol 12 · host 0.13.3 · macOS 15.4
  - type: textarea
    id: logs
    attributes:
      label: Logs / 日志
      description: Settings → Info → Open logs. Paste the relevant lines only.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / 截图
      description: Optional. Drag and drop images.
