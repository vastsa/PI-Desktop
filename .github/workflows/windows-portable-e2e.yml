name: Windows portable E2E

on:
  workflow_dispatch:
    inputs:
      require_taskbar_pin:
        description: "Fail unless the selected Windows runner can pin the app"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "apps/desktop/package.json"
      - "apps/desktop/test/auto-update.test.mjs"
      - "scripts/windows-portable-e2e.ps1"
      - ".github/workflows/windows-portable-e2e.yml"

permissions:
  contents: read

concurrency:
  group: windows-portable-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Windows portable package and taskbar smoke
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build package inputs
        run: |
          set -euo pipefail
          cargo build --release --locked -p host-core &
          host_build_pid=$!
          trap 'kill "$host_build_pid" 2>/dev/null || true' EXIT

          pnpm install --frozen-lockfile
          pnpm --filter '@pi-desktop/desktop^...' --fail-if-no-match build

          wait "$host_build_pid"
          trap - EXIT

      - name: Build Windows packages
        run: pnpm --filter @pi-desktop/desktop run dist:win -- --x64

      - name: Verify Windows release artifacts
        shell: pwsh
        run: |
          $release = "apps/desktop/release"
          $nsis = @(Get-ChildItem -LiteralPath $release -Filter "PI-Desktop-Setup-*.exe" -File)
          $portable = @(Get-ChildItem -LiteralPath $release -Filter "PI-Desktop-Portable-*.exe" -File)
          $feedPath = Join-Path $release "latest.yml"
          if ($nsis.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($nsis.Count)"
          }
          if ($portable.Count -ne 1) {
            throw "Expected exactly one portable executable, found $($portable.Count)"
          }
          if (-not (Test-Path -LiteralPath $feedPath -PathType Leaf)) {
            throw "NSIS update feed was not produced: $feedPath"
          }
          foreach ($artifact in @($nsis + $portable)) {
            if ($artifact.Name -match "\s") {
              throw "Windows artifact name contains whitespace: $($artifact.Name)"
            }
          }
          $feed = Get-Content -LiteralPath $feedPath -Raw
          if ($feed -notmatch "PI-Desktop-Setup-") {
            throw "latest.yml does not reference the NSIS installer"
          }
          if ($feed -match "PI-Desktop-Portable-") {
            throw "latest.yml must not reference the portable executable"
          }
          Write-Host "NSIS_ARTIFACT=$($nsis[0].Name)"
          Write-Host "PORTABLE_ARTIFACT=$($portable[0].Name)"
          Write-Host "UPDATE_FEED=$feedPath"

      - name: Preserve first portable build
        run: |
          set -euo pipefail
          mkdir -p apps/desktop/release/build-a
          mv apps/desktop/release/PI-Desktop-Portable-*.exe apps/desktop/release/build-a/

      - name: Build second portable version from the same source
        working-directory: apps/desktop
        run: >-
          pnpm exec electron-builder --win portable --x64 --publish never
          -c.extraMetadata.version=0.15.2-test-b
          -c.directories.output=release/build-b

      - name: Run portable extraction and taskbar smoke
        shell: pwsh
        env:
          REQUIRE_TASKBAR_PIN: ${{ inputs.require_taskbar_pin }}
        run: |
          $portable = Get-ChildItem "apps/desktop/release/build-a/PI-Desktop-Portable-*.exe" |
            Select-Object -First 1
          $secondPortable = Get-ChildItem "apps/desktop/release/build-b/PI-Desktop-Portable-*.exe" |
            Select-Object -First 1
          if ($null -eq $portable -or $null -eq $secondPortable) {
            throw "Both Windows portable artifacts were not produced"
          }
          $arguments = @{
            PortableExe = $portable.FullName
            SecondPortableExe = $secondPortable.FullName
          }
          if ([string]::Equals([string]$env:REQUIRE_TASKBAR_PIN, "true", [StringComparison]::OrdinalIgnoreCase)) {
            $arguments.RequireTaskbarPin = $true
          }
          $output = @()
          $scriptSucceeded = $false
          try {
            $output = @(& ./scripts/windows-portable-e2e.ps1 @arguments *>&1)
            $scriptSucceeded = $?
          } catch {
            $output += $_
          }
          $outputText = @($output | ForEach-Object { "$_" })
          $outputText |
            Tee-Object -FilePath windows-portable-e2e.log
          if (-not $scriptSucceeded -or $outputText -notcontains "WINDOWS_PORTABLE_E2E=PASS") {
            exit 1
          }

      - name: Upload portable smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-e2e-release
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/desktop/release/build-a/PI-Desktop-Portable-*.exe
            apps/desktop/release/build-b/PI-Desktop-Portable-*.exe
            apps/desktop/release/PI-Desktop-Setup-*.exe
            apps/desktop/release/PI-Desktop-Setup-*.exe.blockmap
            apps/desktop/release/latest.yml
            windows-portable-e2e.log
