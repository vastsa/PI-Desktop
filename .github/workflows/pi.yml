# Reply to `@pi` mentions with the Pi agent.
#
# Only people with write access to this repository can start a run. Anyone else
# is ignored: no comment, no failing job, nothing to react to.
#
# Analysis is read-only on purpose: the agent can read the whole repository and
# that is all. Add `bash`, `edit` and `write` to `allowed_tools` (plus
# `contents: write`, already granted below) when a mention should change code.
#
# There is no turn budget: `timeout-minutes` is the only bound on a run, and the
# tracking comment reports progress every ~30s while it works.
name: Pi

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  pi:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@pi')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@pi')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@pi'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: Tioit-Wang/pi-agent-action@v1
        with:
          provider: deepseek
          model: deepseek-v4.1-flash
          base_url: https://platform.aimom.net/v1
          api_style: openai-completions
          api_key: ${{ secrets.API_KEY }}
          allowed_tools: read,grep,find,ls
